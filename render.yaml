services:
  - type: web
    name: student-learning-pattern-analysis
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/create_demo_data.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROJECT_NAME
        value: "Student Learning Pattern Analysis"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
